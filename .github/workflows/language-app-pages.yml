# Build giao diện app học ngoại ngữ (language-app/) và đưa lên GitHub Pages.
# Cần: Settings → Pages → Source = GitHub Actions; biến LANG_APP_API_URL = URL /exec của Apps Script.
name: language-app → GitHub Pages

on:
  push:
    paths: ['language-app/**', '.github/workflows/language-app-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: language-app-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: language-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: language-app/package-lock.json
      - name: Kiểm tra đã khai báo URL Apps Script
        env:
          VITE_API_URL: ${{ vars.LANG_APP_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Chưa có biến LANG_APP_API_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.LANG_APP_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: language-app/dist

  deploy:
    needs: build
    # Chỉ đăng lên Pages từ nhánh mặc định của repo; nhánh khác chỉ build + test.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
